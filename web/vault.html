<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>open-english vault</title>
<style>
  /* 最小限の見た目のみ。open-english本体のstyle.cssには依存しない
     (このページは別オリジンで単独配信されることを想定した自己完結
     設計のため——外部CSS/JSへの依存はセキュリティ境界を曖昧にする)。 */
  body { font-family: sans-serif; margin: 12px; background: #1b1320; color: #f3e9f7; font-size: 13px; }
  input, button { font-size: 13px; padding: 4px 6px; margin: 2px 0; }
  input[type="password"], input[type="text"] { width: 100%; box-sizing: border-box; }
  .status { font-size: 12px; opacity: 0.85; min-height: 1.4em; }
  .warn { color: #ffb3b3; font-size: 11px; }
</style>
</head>
<body>
<!--
  ============================================================
  vault.html (2026-08-27新設) — クロスオリジンiframeサンドボックス保管庫

  【目的】GitHubトークン等の秘密情報の復号、および外部API(GitHub REST
  API等)への実際のfetch呼び出しを、親ページ(open-english本体)とは
  隔離された場所で行う。親ページのJSが万一XSSで乗っ取られても、この
  iframe内のDOM・メモリ・localStorageへは同一オリジンポリシーにより
  一切アクセスできない(Stripe Elements等が採用する実績のある手法)。
  親ページとはpostMessageで最小限のやり取りのみ行い、復号済みの平文
  トークン自体は親ページへは絶対に渡さない——渡すのは実行結果
  (例: pushしたリポジトリのURL)のみ。

  【正直な開示、必ず読むこと】
  - このファイルは単体で完結する自己完結ページ(app.js等への依存無し)
    として書いてある。だが**本当の分離効果を得るには、このパスを
    open-english本体(index.html)とは別オリジン(別サブドメイン等)
    で配信する必要がある**。同一オリジンで配信している(例:
    開発環境でindex.htmlと同じサーバーの/vault.htmlとして動かして
    いる)間は、同一オリジンポリシーによる分離効果は無く、通常の
    埋め込みiframeと変わらない(親ページのJSがこのiframeのDOMへ直接
    アクセスできてしまう)。今回の実装は「仕組みが正しく動くこと」を
    実機検証したものであり、「実際に別オリジンで配信して分離効果を
    確認した」わけではない(そのためには別ドメイン・証明書の用意が
    必要で、この開発セッションの範囲外)。
  - postMessageの送受信元origin検証は必須(検証を省略すると、任意の
    ページがこのiframeへメッセージを送り込めてしまう)。このファイルは
    埋め込み側(親ページ)のoriginをURLクエリパラメータ`?parentOrigin=`
    で受け取り、そのoriginからのメッセージのみ処理する。
  - 平文保存(旧来の③相当)は、このvault自体が「保管を安全にする」ため
    に存在する以上、意味が薄いためここでは提供しない(①ファイル/
    ②パスフレーズ暗号化のみ)。
  ============================================================
-->
<h3>🔒 vault</h3>
<p class="warn" id="origin-warning"></p>

<div>
  <label>受け渡し方法 / mode<br />
    <select id="mode">
      <option value="encrypted">② パスフレーズで暗号化 / Passphrase-encrypted</option>
      <option value="file">① ローカルファイル / Local file</option>
    </select>
  </label>
</div>

<div id="encrypted-section">
  <label>パスフレーズ / Passphrase<br /><input type="password" id="passphrase" autocomplete="off" /></label>
  <label>GitHub PAT(新規保存時のみ) / GitHub PAT (only when saving new)<br /><input type="password" id="token-input" autocomplete="off" placeholder="github_pat_..." /></label>
  <button type="button" id="save-btn">🔐 暗号化して保存 / Encrypt &amp; save</button>
  <button type="button" id="unlock-btn">🔓 復号 / Unlock</button>
  <button type="button" id="clear-btn">🗑 削除 / Clear</button>
</div>

<div id="file-section" class="hidden" style="display:none;">
  <button type="button" id="file-btn">📂 ファイルを選択 / Select file</button>
</div>

<hr />
<h3>🔎 Google Search key</h3>
<label>パスフレーズ / Passphrase<br /><input type="password" id="gs-passphrase" autocomplete="off" /></label>
<label>API Key(新規保存時のみ) / API Key (only when saving new)<br /><input type="password" id="gs-key-input" autocomplete="off" placeholder="AIzaSy..." /></label>
<label>Search Engine ID / cx(新規保存時のみ)<br /><input type="text" id="gs-cx-input" autocomplete="off" placeholder="e4990caa4651e48ba" /></label>
<button type="button" id="gs-save-btn">🔐 暗号化して保存 / Encrypt &amp; save</button>
<button type="button" id="gs-unlock-btn">🔓 復号 / Unlock</button>
<button type="button" id="gs-clear-btn">🗑 削除 / Clear</button>

<p class="status" id="status">Waiting for parent page... / 親ページからの操作待ちです...</p>

<script>
(() => {
  "use strict";

  const params = new URLSearchParams(location.search);
  const ALLOWED_PARENT_ORIGIN = params.get("parentOrigin") || "";
  const originWarningEl = document.getElementById("origin-warning");
  if (!ALLOWED_PARENT_ORIGIN) {
    originWarningEl.textContent =
      "⚠ parentOrigin not set — this vault will refuse all parent messages until it is. / " +
      "parentOriginが未設定です——設定されるまで親ページからのメッセージをすべて拒否します。";
  } else if (ALLOWED_PARENT_ORIGIN === location.origin) {
    originWarningEl.textContent =
      "⚠ Same origin as the parent — no real isolation benefit right now (see comments at the top of this file). / " +
      "親ページと同一オリジンです——現状は分離の効果がありません(このファイル冒頭のコメント参照)。";
  }

  // ---- 汎用暗号化ヘルパー(open-english/app.js のowEncryptSecret/
  // owDecryptSecretと同一アルゴリズム・同一データ形式。意図的に複製
  // している——このページはapp.jsに依存しない自己完結設計のため) ----
  async function deriveAesKey(passphrase, salt) {
    const baseKey = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" },
      baseKey, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
    );
  }
  function bytesToBase64(bytes) {
    let binary = "";
    for (const b of bytes) binary += String.fromCharCode(b);
    return btoa(binary);
  }
  function base64ToBytes(b64) {
    return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  }
  async function encryptSecret(plaintext, passphrase) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveAesKey(passphrase, salt);
    const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(plaintext));
    return JSON.stringify({ salt: bytesToBase64(salt), iv: bytesToBase64(iv), ciphertext: bytesToBase64(new Uint8Array(ciphertext)) });
  }
  async function decryptSecret(payloadJson, passphrase) {
    const payload = JSON.parse(payloadJson);
    const salt = base64ToBytes(payload.salt);
    const iv = base64ToBytes(payload.iv);
    const key = await deriveAesKey(passphrase, salt);
    const plainBytes = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, base64ToBytes(payload.ciphertext));
    return new TextDecoder().decode(plainBytes);
  }
  function utf8ToBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = "";
    for (const b of bytes) binary += String.fromCharCode(b);
    return btoa(binary);
  }

  const VAULT_TOKEN_ENCRYPTED_KEY = "vault.githubTokenEncrypted";
  let unlockedToken = null; // メモリ上のみ、絶対に親ページへは送らない

  const modeEl = document.getElementById("mode");
  const encSectionEl = document.getElementById("encrypted-section");
  const fileSectionEl = document.getElementById("file-section");
  const statusEl = document.getElementById("status");
  const passphraseEl = document.getElementById("passphrase");
  const tokenInputEl = document.getElementById("token-input");

  function updateModeSections() {
    const mode = modeEl.value;
    encSectionEl.style.display = mode === "encrypted" ? "" : "none";
    fileSectionEl.style.display = mode === "file" ? "" : "none";
  }
  modeEl.addEventListener("change", updateModeSections);
  updateModeSections();

  function setStatus(text) { statusEl.textContent = text; }

  document.getElementById("save-btn").addEventListener("click", async () => {
    const token = tokenInputEl.value.trim();
    const passphrase = passphraseEl.value;
    if (!token || !passphrase) {
      setStatus("⚠ Enter both token and passphrase / トークンとパスフレーズの両方を入力してください");
      return;
    }
    try {
      const payload = await encryptSecret(token, passphrase);
      localStorage.setItem(VAULT_TOKEN_ENCRYPTED_KEY, payload);
      unlockedToken = token;
      tokenInputEl.value = "";
      passphraseEl.value = "";
      setStatus("✅ Encrypted & saved, unlocked in memory / 暗号化して保存、メモリ上で復号済みです");
    } catch (err) {
      setStatus(`⚠ Failed / 失敗しました: ${err}`);
    }
  });

  document.getElementById("unlock-btn").addEventListener("click", async () => {
    const passphrase = passphraseEl.value;
    const payload = localStorage.getItem(VAULT_TOKEN_ENCRYPTED_KEY);
    if (!payload) { setStatus("⚠ No encrypted token saved / 保存済みの暗号化トークンがありません"); return; }
    if (!passphrase) { setStatus("⚠ Enter your passphrase / パスフレーズを入力してください"); return; }
    try {
      unlockedToken = await decryptSecret(payload, passphrase);
      passphraseEl.value = "";
      setStatus("✅ Unlocked / 復号しました");
    } catch (err) {
      unlockedToken = null;
      setStatus("⚠ Decryption failed (wrong passphrase?) / 復号に失敗(パスフレーズが違う可能性)");
    }
  });

  document.getElementById("clear-btn").addEventListener("click", () => {
    localStorage.removeItem(VAULT_TOKEN_ENCRYPTED_KEY);
    unlockedToken = null;
    setStatus("🗑 Cleared / 削除しました");
  });

  // ---- Google Search key(2026-08-27追加、GitHubトークンと同じ隔離を
  // Google検索キーにも適用——ユーザー指示「全てセキュアモードブラウザで
  // 受け渡しした方が良いのではないか」への対応) ----
  const VAULT_GS_ENCRYPTED_KEY = "vault.googleSearchCredsEncrypted";
  let unlockedGoogleSearchCreds = null; // {api_key, cx}、メモリ上のみ

  const gsPassphraseEl = document.getElementById("gs-passphrase");
  const gsKeyInputEl = document.getElementById("gs-key-input");
  const gsCxInputEl = document.getElementById("gs-cx-input");

  document.getElementById("gs-save-btn").addEventListener("click", async () => {
    const apiKey = gsKeyInputEl.value.trim();
    const cx = gsCxInputEl.value.trim();
    const passphrase = gsPassphraseEl.value;
    if (!apiKey || !cx || !passphrase) {
      setStatus("⚠ Enter API key, cx, and passphrase / API key・cx・パスフレーズをすべて入力してください");
      return;
    }
    try {
      const payload = await encryptSecret(JSON.stringify({ api_key: apiKey, cx }), passphrase);
      localStorage.setItem(VAULT_GS_ENCRYPTED_KEY, payload);
      unlockedGoogleSearchCreds = { api_key: apiKey, cx };
      gsKeyInputEl.value = "";
      gsCxInputEl.value = "";
      gsPassphraseEl.value = "";
      setStatus("✅ Google Search key encrypted & saved, unlocked in memory / Google検索キーを暗号化して保存、メモリ上で復号済みです");
    } catch (err) {
      setStatus(`⚠ Failed / 失敗しました: ${err}`);
    }
  });

  document.getElementById("gs-unlock-btn").addEventListener("click", async () => {
    const passphrase = gsPassphraseEl.value;
    const payload = localStorage.getItem(VAULT_GS_ENCRYPTED_KEY);
    if (!payload) { setStatus("⚠ No encrypted Google Search key saved / 保存済みの暗号化Google検索キーがありません"); return; }
    if (!passphrase) { setStatus("⚠ Enter your passphrase / パスフレーズを入力してください"); return; }
    try {
      unlockedGoogleSearchCreds = JSON.parse(await decryptSecret(payload, passphrase));
      gsPassphraseEl.value = "";
      setStatus("✅ Google Search key unlocked / Google検索キーを復号しました");
    } catch (err) {
      unlockedGoogleSearchCreds = null;
      setStatus("⚠ Decryption failed (wrong passphrase?) / 復号に失敗(パスフレーズが違う可能性)");
    }
  });

  document.getElementById("gs-clear-btn").addEventListener("click", () => {
    localStorage.removeItem(VAULT_GS_ENCRYPTED_KEY);
    unlockedGoogleSearchCreds = null;
    setStatus("🗑 Google Search key cleared / Google検索キーを削除しました");
  });

  // Google Custom Search JSON APIをこのvault内から直接呼ぶ(親ページは
  // 経由しない)。任意のOriginへAccess-Control-Allow-Originを返すことを
  // 2026-08-27にcurlで実機確認済み(CORS対応済み)。
  async function googleSearchDirect(query, apiKey, cx, maxResults) {
    const url = `https://www.googleapis.com/customsearch/v1?key=${encodeURIComponent(apiKey)}&cx=${encodeURIComponent(cx)}&q=${encodeURIComponent(query)}&num=${Math.min(Math.max(maxResults || 3, 1), 10)}`;
    const res = await fetch(url);
    if (!res.ok) {
      let detail = "";
      try {
        const body = await res.json();
        detail = body && body.error && body.error.message ? ` — ${body.error.message}` : "";
      } catch { /* ignore */ }
      throw new Error(`Google Custom Search API returned HTTP ${res.status}${detail}`);
    }
    const data = await res.json();
    const items = Array.isArray(data.items) ? data.items : [];
    return items.map((item) => ({ title: item.title || "", snippet: item.snippet || "", link: item.link || "" }));
  }

  document.getElementById("file-btn").addEventListener("click", () => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".txt,text/plain";
    input.addEventListener("change", async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      try {
        unlockedToken = (await file.text()).trim();
        setStatus("✅ Loaded from file (not saved) / ファイルから読み込みました(保存はされません)");
      } catch (err) {
        setStatus(`⚠ Failed to read file / 読み込み失敗: ${err}`);
      }
    });
    input.click();
  });

  // ---- GitHub REST APIを直接呼ぶ(このiframeのオリジンからのfetch。
  // 親ページ・親ページのサーバーは一切経由しない) ----
  async function githubCreateRepoAndPush({ repoName, isPrivate, filePath, fileContent, commitMessage }) {
    if (!unlockedToken) throw new Error("Vault is locked — unlock it first / vaultがロックされています——先に復号してください");
    if (!repoName) throw new Error("repoName is required / リポジトリ名が必要です");
    const headers = {
      Authorization: `Bearer ${unlockedToken}`,
      Accept: "application/vnd.github+json",
      "Content-Type": "application/json",
    };
    const createRes = await fetch("https://api.github.com/user/repos", {
      method: "POST", headers,
      body: JSON.stringify({ name: repoName, private: !!isPrivate, auto_init: false }),
    });
    if (!createRes.ok) throw new Error(`repo creation failed (HTTP ${createRes.status}): ${await createRes.text().catch(() => "")}`);
    const repo = await createRes.json();
    const owner = repo.owner && repo.owner.login;
    if (!owner) throw new Error("GitHub API response had no owner info");

    const putRes = await fetch(
      `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repoName)}/contents/${encodeURIComponent(filePath || "README.md")}`,
      { method: "PUT", headers, body: JSON.stringify({ message: commitMessage || "Initial commit", content: utf8ToBase64(fileContent || "") }) }
    );
    if (!putRes.ok) throw new Error(`file push failed (HTTP ${putRes.status}): ${await putRes.text().catch(() => "")}`);
    return repo.html_url;
  }

  // ---- 親ページとのpostMessageプロトコル ----
  // 受信: {type: "vault:githubPush", requestId, repoName, isPrivate, filePath, fileContent, commitMessage}
  // 送信: {type: "vault:githubPushResult", requestId, ok, url} または {..., ok:false, error}
  // 受信: {type: "vault:status"} → 送信: {type: "vault:statusResult", unlocked: boolean}
  window.addEventListener("message", async (event) => {
    if (!ALLOWED_PARENT_ORIGIN || event.origin !== ALLOWED_PARENT_ORIGIN) {
      return; // 未知のoriginからのメッセージは黙って無視(検証必須)
    }
    const data = event.data || {};
    if (data.type === "vault:githubPush") {
      try {
        const url = await githubCreateRepoAndPush(data);
        event.source.postMessage({ type: "vault:githubPushResult", requestId: data.requestId, ok: true, url }, event.origin);
        setStatus(`✅ Pushed for parent page: ${url}`);
      } catch (err) {
        event.source.postMessage({ type: "vault:githubPushResult", requestId: data.requestId, ok: false, error: String(err.message || err) }, event.origin);
        setStatus(`⚠ Push failed: ${err.message || err}`);
      }
    } else if (data.type === "vault:status") {
      event.source.postMessage(
        { type: "vault:statusResult", requestId: data.requestId, unlocked: !!unlockedToken, googleSearchUnlocked: !!unlockedGoogleSearchCreds },
        event.origin
      );
    } else if (data.type === "vault:googleSearch") {
      // Google検索結果(タイトル・スニペット・URL)は個人情報ではなく、
      // 親ページへ渡しても問題ない情報のため、これだけは結果として返す
      // (返さないのはAPIキー・cx自体のみ)。
      if (!unlockedGoogleSearchCreds) {
        event.source.postMessage(
          { type: "vault:googleSearchResult", requestId: data.requestId, ok: false, error: "Google Search key is locked — unlock it in the vault first / Google検索キーがロックされています——vault内で先に復号してください" },
          event.origin
        );
        return;
      }
      try {
        const results = await googleSearchDirect(data.query, unlockedGoogleSearchCreds.api_key, unlockedGoogleSearchCreds.cx, data.maxResults);
        event.source.postMessage({ type: "vault:googleSearchResult", requestId: data.requestId, ok: true, results }, event.origin);
        setStatus(`✅ Searched for parent page: ${data.query}`);
      } catch (err) {
        event.source.postMessage({ type: "vault:googleSearchResult", requestId: data.requestId, ok: false, error: String(err.message || err) }, event.origin);
        setStatus(`⚠ Search failed: ${err.message || err}`);
      }
    }
  });
})();
</script>
</body>
</html>
